# Permish — Docker Compose
#
# Local development (no HTTPS):
#   docker compose up -d
#
# Production with HTTPS:
#   DOMAIN=permish.app docker compose --profile production up -d
#
# One backend: the Bun + Hono + SQLite server (server/). It handles routes, auth,
# PDF generation, email, and SMS in a single process — no PocketBase, no sidecar.

services:
  # =========================================================================
  # Caddy — Reverse proxy with automatic HTTPS (production profile)
  # =========================================================================
  caddy:
    image: caddy:2-alpine
    profiles: ["production"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}

  # =========================================================================
  # Permish server — Bun + Hono + SQLite (the only backend)
  # =========================================================================
  server:
    build: ./server
    restart: unless-stopped
    expose:
      - "3001"
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - db-data:/app/data
      - pdf-storage:/app/pdfs
      - uploads-storage:/app/uploads
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/permish.sqlite
      - PDF_DIR=/app/pdfs
      - UPLOADS_DIR=/app/uploads
      # Set true only when requests arrive via the caddy proxy (production profile),
      # so rate limiting keys on the real client IP instead of the proxy socket.
      - TRUST_PROXY=${TRUST_PROXY:-false}
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3

  # =========================================================================
  # SvelteKit Frontend
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      args:
        - PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost:3001}
    restart: unless-stopped
    expose:
      - "3000"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      server:
        condition: service_healthy
    environment:
      - PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost:3001}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)throw 1})"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  db-data:
  pdf-storage:
  uploads-storage:
  caddy_data:
  caddy_config:
